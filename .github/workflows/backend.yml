# =============================================================================
# Sanad AI — Backend CI/CD Pipeline
# =============================================================================
# Stages:
#   1. Test    — Install deps & run pytest
#   2. Build   — Build Docker image & push to Docker Hub
#   3. Deploy  — SSH into EC2, pull latest image, restart container
# =============================================================================

name: Backend CI/CD Pipeline

on:
  push:
    branches: [backend, main]
    paths-ignore:
      - 'frontend/**'
  pull_request:
    branches: [backend, main]
    paths-ignore:
      - 'frontend/**'

env:
  DOCKER_IMAGE: mazen1393/sanad-ai-backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Test
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/backend' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: Deploy to EC2
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/backend' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,otel-collector-config.yaml"
          target: "~/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -euxo pipefail

            export APP_DIR="$HOME/sanad-app"

            # ── Ensure Docker Compose V2 plugin is installed ──────────────────
            if ! docker compose version > /dev/null 2>&1; then
              echo "Installing Docker Compose V2 plugin..."
              DOCKER_CLI_PLUGINS="$HOME/.docker/cli-plugins"
              mkdir -p "$DOCKER_CLI_PLUGINS"
              curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
                -o "$DOCKER_CLI_PLUGINS/docker-compose"
              chmod +x "$DOCKER_CLI_PLUGINS/docker-compose"
              echo "Docker Compose V2 installed: $(docker compose version)"
            fi

            # Ensure the app directory has the latest config files
            mkdir -p "$APP_DIR"
            cp ~/docker-compose.yml "$APP_DIR/docker-compose.yml"
            cp ~/otel-collector-config.yaml "$APP_DIR/otel-collector-config.yaml"

            # Write the .env file from the secret into the app directory
            echo "$ENV_FILE_CONTENT" > "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"

            # ── Stop & remove legacy standalone container (frees port 8000) ──
            docker stop sanad-ai sanad-backend 2>/dev/null || true
            docker rm   sanad-ai sanad-backend 2>/dev/null || true

            cd "$APP_DIR"

            # Pull the latest backend image
            docker compose pull backend

            # Recreate only changed containers (keeps libsql / otel-collector
            # running if they are already healthy and unchanged)
            docker compose up -d --remove-orphans

            # Clean up dangling images to save disk space
            docker image prune -f

            # Wait for the backend to become healthy (health check with retries)
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/30 — waiting 10s..."
              sleep 10
            done

            echo "❌ Health check failed after 5 minutes"
            docker compose logs backend --tail 50
            exit 1
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
