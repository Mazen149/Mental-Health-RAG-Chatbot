# =============================================================================
# Sanad AI — Backend CI/CD Pipeline
# =============================================================================
# Stages:
#   1. Test    — Install deps & run pytest
#   2. Build   — Build Docker image & push to Docker Hub
#   3. Deploy  — SSH into EC2, pull latest image, restart container
# =============================================================================

name: Backend CI/CD Pipeline

on:
  push:
    branches: [backend, main]
    paths-ignore:
      - 'frontend/**'
  pull_request:
    branches: [backend, main]
    paths-ignore:
      - 'frontend/**'

env:
  DOCKER_IMAGE: mazen1393/sanad-ai-backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Test
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      # The repo's large model files live in Git LFS, but the test suite only
      # needs the small language-detection models (~6 MB). Those are mirrored on
      # the public Hugging Face artifacts repo (the same source the app uses at
      # runtime), so we fetch them directly instead of pulling >1 GB via LFS.
      - name: Fetch language-detection artifacts
        run: |
          BASE="https://huggingface.co/mazen248/sanad-ai-artifacts/resolve/main"
          mkdir -p artifacts/langauge_detection
          curl -sSLf -o artifacts/langauge_detection/language_detection_best_model.pkl \
            "$BASE/langauge_detection/language_detection_best_model.pkl"
          curl -sSLf -o artifacts/langauge_detection/language_detection_best_vectorizer.pkl \
            "$BASE/langauge_detection/language_detection_best_vectorizer.pkl"
          curl -sSLf -o artifacts/lid.176.ftz "$BASE/lid.176.ftz"

      - name: Run tests
        run: uv run pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/backend' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: Deploy to EC2
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/backend' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Copy config files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,otel-collector-config.yaml"
          target: "~/"
          strip_components: 0

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ENV_FILE_CONTENT,CLOUDFLARE_TUNNEL_TOKEN
          script: |
            set -euxo pipefail

            export APP_DIR="$HOME/sanad-app"

            # ── Ensure Docker Compose V2 plugin is installed ──────────────────
            if ! docker compose version > /dev/null 2>&1; then
              echo "Installing Docker Compose V2 plugin..."
              DOCKER_CLI_PLUGINS="$HOME/.docker/cli-plugins"
              mkdir -p "$DOCKER_CLI_PLUGINS"
              curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
                -o "$DOCKER_CLI_PLUGINS/docker-compose"
              chmod +x "$DOCKER_CLI_PLUGINS/docker-compose"
              echo "Docker Compose V2 installed: $(docker compose version)"
            fi

            # Ensure the app directory has the latest config files
            mkdir -p "$APP_DIR"
            cp ~/docker-compose.yml "$APP_DIR/docker-compose.yml"
            cp ~/otel-collector-config.yaml "$APP_DIR/otel-collector-config.yaml"

            # Write the .env file from the secret into the app directory
            echo "$ENV_FILE_CONTENT" > "$APP_DIR/.env"
            chmod 600 "$APP_DIR/.env"

            # ── Optional Cloudflare Tunnel ───────────────────────────────────
            # Appended separately so enabling the tunnel only needs one new
            # secret instead of rewriting ENV_FILE_CONTENT. Tracing is off here
            # so the token never reaches the log.
            set +x
            COMPOSE_PROFILES=""
            if [ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
              echo "CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN" >> "$APP_DIR/.env"
              COMPOSE_PROFILES="tunnel"
              echo "Cloudflare Tunnel: enabled"
            else
              echo "Cloudflare Tunnel: disabled (CLOUDFLARE_TUNNEL_TOKEN not set)"
            fi
            export COMPOSE_PROFILES
            set -x

            # ── Stop & remove legacy standalone container (frees port 8000) ──
            docker stop sanad-ai sanad-backend 2>/dev/null || true
            docker rm   sanad-ai sanad-backend 2>/dev/null || true

            cd "$APP_DIR"

            # Pull the latest backend image
            docker compose pull backend

            # Recreate only changed containers (keeps libsql / otel-collector
            # running if they are already healthy and unchanged).
            # If the backend fails to come up, dump its logs before exiting —
            # otherwise `set -e` aborts here and the failure reason is lost.
            if ! docker compose up -d --remove-orphans; then
              echo "===== docker compose up failed — backend logs below ====="
              docker compose logs backend --tail 200 || true
              docker compose ps || true
              exit 1
            fi

            # Clean up dangling images to save disk space
            docker image prune -f

            # Wait for the backend to become healthy (health check with retries)
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/30 — waiting 10s..."
              sleep 10
            done

            echo "❌ Health check failed after 5 minutes"
            docker compose logs backend --tail 50
            exit 1
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
          # Optional: add this secret to publish the app over HTTPS via a
          # Cloudflare Tunnel. Absent, the tunnel container is never started.
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
