# =============================================================================
# Sanad AI — CI/CD Pipeline
# =============================================================================
# Stages:
#   1. Test    — Install deps & run pytest
#   2. Build   — Build Docker image & push to Docker Hub
#   3. Deploy  — SSH into EC2, pull latest image, restart container
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [backend-mazen]
  pull_request:
    branches: [backend-mazen]

env:
  DOCKER_IMAGE: mazen1393/sanad-ai-backend

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: Test
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2: Build & Push Docker Image
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend-mazen'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 3: Deploy to EC2
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/backend-mazen'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ENV_FILE_CONTENT
          script: |
            set -euxo pipefail

            # Write the .env file from the environment variable safely
            echo "$ENV_FILE_CONTENT" > ~/app.env

            # Pull the latest image
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Stop and remove the old container (ignore errors if not running)
            docker stop sanad-ai 2>/dev/null || true
            docker rm sanad-ai 2>/dev/null || true

            # Start the new container
            docker run -d \
              --name sanad-ai \
              --env-file ~/app.env \
              -p 8000:8000 \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest

            # Clean up old images to save disk space
            docker image prune -f

            # Wait for the app to start (health check with retries)
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i/30 — waiting 10s..."
              sleep 10
            done

            echo "❌ Health check failed after 5 minutes"
            docker logs sanad-ai --tail 50
            exit 1
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
