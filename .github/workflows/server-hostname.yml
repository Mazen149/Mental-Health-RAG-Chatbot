# =============================================================================
# Sanad AI — Publish the backend on an additional hostname (nginx + HTTPS)
# =============================================================================
# Manually triggered. Serves the API over HTTPS on a second hostname so the
# deployment no longer depends on a single dynamic-DNS name.
#
# Run "inspect" first — it only reads, and reports how nginx and certbot are
# installed on the instance. Then run "setup", which:
#   * writes a NEW file in /etc/nginx/conf.d and never edits an existing vhost
#   * validates with `nginx -t` BEFORE reloading, removing the file again if
#     the config does not validate
#   * obtains a Let's Encrypt certificate with certbot
#
# Prerequisite for "setup": the hostname must already resolve to this instance.
# Let's Encrypt proves control by fetching a challenge over port 80, so DNS has
# to be correct first — the job checks this and stops early if it is not.
# =============================================================================

name: Server Hostname Setup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect (read-only) or setup (adds vhost + certificate)"
        required: true
        default: inspect
        type: choice
        options: [inspect, setup]
      hostname:
        description: "Hostname to publish, e.g. sanad.myddns.me"
        required: true
        type: string
      email:
        description: "Email for Let's Encrypt expiry notices (optional)"
        required: false
        type: string

jobs:
  hostname:
    name: Configure hostname
    runs-on: ubuntu-latest

    steps:
      - name: Check DNS resolves before touching the server
        env:
          HOSTNAME_INPUT: ${{ inputs.hostname }}
        run: |
          set -euo pipefail
          echo "Resolving $HOSTNAME_INPUT ..."
          RESOLVED="$(getent hosts "$HOSTNAME_INPUT" | awk '{print $1}' | head -1 || true)"
          if [ -z "$RESOLVED" ]; then
            echo "::error::$HOSTNAME_INPUT does not resolve. Point it at the EC2 public IP first."
            exit 1
          fi
          echo "$HOSTNAME_INPUT -> $RESOLVED"
          echo "RESOLVED_IP=$RESOLVED" >> "$GITHUB_ENV"

      - name: Run on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: MODE,VHOST,LE_EMAIL,RESOLVED_IP
          script: |
            set -euo pipefail

            echo "=============================================="
            echo " mode     : $MODE"
            echo " hostname : $VHOST"
            echo "=============================================="

            echo ""
            echo "--- does the hostname point at this instance? ---"
            MYIP="$(curl -s --max-time 10 https://checkip.amazonaws.com || echo unknown)"
            if [ "$MYIP" = "$RESOLVED_IP" ]; then
              echo "yes - $VHOST resolves to this instance"
              DNS_OK=yes
            else
              echo "NO - $VHOST resolves to $RESOLVED_IP but this instance is different"
              DNS_OK=no
            fi

            echo ""
            echo "--- nginx ---"
            HAVE_SYSTEM_NGINX=no
            if command -v nginx >/dev/null 2>&1; then
              HAVE_SYSTEM_NGINX=yes
              echo "system nginx: $(nginx -v 2>&1)"
            else
              echo "no system nginx binary on the host"
            fi
            echo "containers publishing port 80:"
            sudo docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep ':80->' | sed 's/^/  /' || echo "  (none)"

            echo ""
            echo "--- existing vhosts ---"
            sudo ls -1 /etc/nginx/conf.d/ 2>/dev/null | sed 's/^/  /' || echo "  (no /etc/nginx/conf.d)"
            echo "server_name entries:"
            sudo grep -rhs "server_name" /etc/nginx/conf.d/ /etc/nginx/nginx.conf 2>/dev/null | sed 's/^/  /' || true

            echo ""
            echo "--- certbot ---"
            if command -v certbot >/dev/null 2>&1; then
              echo "certbot: $(certbot --version 2>&1)"
              sudo certbot certificates 2>/dev/null | grep -E "Certificate Name|Domains|Expiry Date" | sed 's/^/  /' || true
            else
              echo "certbot: not installed"
            fi

            echo ""
            echo "--- backend reachable locally? ---"
            curl -s -o /dev/null -w "  http://127.0.0.1:8000/health -> %{http_code}\n" http://127.0.0.1:8000/health || echo "  backend not answering on 8000"

            if [ "$MODE" = "inspect" ]; then
              echo ""
              echo "inspect complete - nothing was changed."
              exit 0
            fi

            # ---------------- setup ----------------
            if [ "$DNS_OK" != "yes" ]; then
              echo "::error::$VHOST does not point at this instance; certificate issuance would fail."
              exit 1
            fi
            if [ "$HAVE_SYSTEM_NGINX" != "yes" ]; then
              echo "::error::No host-installed nginx found; not attempting to reconfigure."
              exit 1
            fi

            CONF="/etc/nginx/conf.d/${VHOST}.conf"
            echo ""
            echo "--- writing $CONF (new file, existing vhosts untouched) ---"

            sudo tee "$CONF" > /dev/null <<'NGINXCONF'
            server {
                listen 80;
                listen [::]:80;
                server_name __VHOST__;

                # Whisper audio uploads on /transcribe
                client_max_body_size 15M;

                location / {
                    proxy_pass http://127.0.0.1:8000;
                    proxy_http_version 1.1;
                    proxy_set_header Host              $host;
                    proxy_set_header X-Real-IP         $remote_addr;
                    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;

                    # /chat/stream is server-sent events - must not be buffered
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 300s;
                }
            }
            NGINXCONF

            sudo sed -i 's/^            //' "$CONF"
            sudo sed -i "s/__VHOST__/${VHOST}/" "$CONF"

            echo "--- validating ---"
            if ! sudo nginx -t; then
              echo "::error::nginx config invalid - removing the new file, server left as it was"
              sudo rm -f "$CONF"
              sudo nginx -t || true
              exit 1
            fi
            sudo systemctl reload nginx
            echo "nginx reloaded"

            echo ""
            echo "--- plain HTTP check (before TLS) ---"
            curl -s -o /dev/null -w "  http://${VHOST}/health -> %{http_code}\n" "http://${VHOST}/health" || true

            echo ""
            echo "--- certbot ---"
            if ! command -v certbot >/dev/null 2>&1; then
              echo "installing certbot ..."
              sudo dnf install -y certbot python3-certbot-nginx >/dev/null 2>&1 \
                || sudo yum install -y certbot python3-certbot-nginx >/dev/null 2>&1 \
                || { echo "::error::could not install certbot"; exit 1; }
            fi

            if [ -n "${LE_EMAIL:-}" ]; then
              EMAIL_ARG="-m ${LE_EMAIL}"
            else
              EMAIL_ARG="--register-unsafely-without-email"
            fi

            sudo certbot --nginx -d "$VHOST" --non-interactive --agree-tos $EMAIL_ARG --redirect

            echo ""
            echo "--- verifying ---"
            sudo nginx -t && sudo systemctl reload nginx
            curl -s -o /dev/null -w "  https://${VHOST}/health -> %{http_code}\n" "https://${VHOST}/health"
            sudo certbot certificates 2>/dev/null | grep -A4 "Certificate Name: ${VHOST}" | sed 's/^/  /' || true

            echo ""
            echo "done -> https://${VHOST}"
        env:
          MODE: ${{ inputs.mode }}
          VHOST: ${{ inputs.hostname }}
          LE_EMAIL: ${{ inputs.email }}
