# =============================================================================
# SANAD AI — Docker Compose (Production)
# =============================================================================
# Services:
#   - libsql        : Local LibSQL (SQLite-compatible) database
#   - otel-collector: OpenTelemetry Collector — receives OTLP from backend,
#                     forwards metrics/traces/logs to Axiom
#   - backend       : FastAPI (uvicorn) on port 8000
#   - frontend      : Nginx serving the SPA on port 80 → exposed as 3000
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Database — Local LibSQL (SQLite-compatible server)
  # ---------------------------------------------------------------------------
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: sanad-ai-db
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      - SQLD_NODE=primary

    volumes:
      - sqlite-db:/var/lib/sqld

    networks:
      - sanad-network

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # Receives OTLP signals from the backend (port 4318 HTTP / 4317 gRPC)
  # and forwards them authenticated to Axiom.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sanad-otel-collector
    restart: unless-stopped

    command: [ "--config=/etc/otelcol/otel-collector-config.yaml" ]

    volumes:
      - ${APP_DIR:-~/sanad-app}/otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro

    ports:
      - "4317:4317" # gRPC OTLP receiver
      - "4318:4318" # HTTP OTLP receiver
      - "8888:8888" # Prometheus metrics exposed by the collector itself

    environment:
      - AXIOM_API_TOKEN=${AXIOM_API_TOKEN}
      - AXIOM_METRICS_DATASET=${AXIOM_METRICS_DATASET:-nlp-project}

    networks:
      - sanad-network

    depends_on:
      libsql:
        condition: service_started

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:13133/" ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # Backend — FastAPI + RAG pipeline
  # ---------------------------------------------------------------------------
  backend:
    image: mazen1393/sanad-ai-backend:latest
    container_name: sanad-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env # All secrets & model config (see .env.example)

    environment:
      - PYTHONUNBUFFERED=1 # Ensure real-time log output
      # OTel: send to the collector container (not directly to Axiom)
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - OTEL_METRIC_EXPORT_INTERVAL_MS=15000

    dns:
      - 8.8.8.8
      - 8.8.4.4

    volumes:
      - backend-artifacts:/app/artifacts # Persist downloaded HF models
      - backend-qdrant:/app/qdrant_db # Persist local Qdrant data

    networks:
      - sanad-network

    depends_on:
      otel-collector:
        condition: service_started

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      start_period: 600s # Backend downloads models on first start (~5 min)
      retries: 3

    deploy:
      resources:
        limits:
          memory: 4G # Cap memory (adjust for your host)
        reservations:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend — Nginx SPA
  # ---------------------------------------------------------------------------
  frontend:
    image: mazen1393/sanad-ai-frontend:latest
    container_name: sanad-frontend
    restart: unless-stopped

    ports:
      - "3000:80" # Access UI at http://localhost:3000

    networks:
      - sanad-network

    depends_on:
      backend:
        condition: service_healthy # Wait until backend is healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — optional public HTTPS entrypoint
  # ---------------------------------------------------------------------------
  # Publishes the app on a Cloudflare hostname with a valid TLS certificate
  # without opening any inbound port: cloudflared dials *out* to Cloudflare and
  # requests are pushed back down that connection. Because nothing depends on
  # the instance's public IP, the URL keeps working after a restart assigns a
  # new one.
  #
  # Disabled unless CLOUDFLARE_TUNNEL_TOKEN is set — the deploy job only enables
  # the "tunnel" profile when that secret exists, so the stack is unchanged
  # otherwise.
  #
  # Point the tunnel's public hostname at http://frontend:80 in the Cloudflare
  # dashboard: nginx already proxies /chat, /login, /register and /transcribe to
  # the backend, so the whole app is served from a single HTTPS origin (no CORS,
  # no mixed content, and session cookies / microphone access work).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sanad-cloudflared
    restart: unless-stopped

    profiles:
      - tunnel

    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

    networks:
      - sanad-network

    depends_on:
      frontend:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# =============================================================================
# Network — isolated bridge network for inter-service communication
# =============================================================================
networks:
  sanad-network:
    name: sanad-network
    driver: bridge

# =============================================================================
# Volumes — named volumes for data persistence across restarts
# =============================================================================
volumes:
  backend-artifacts:
    name: sanad-backend-artifacts
  backend-qdrant:
    name: sanad-backend-qdrant
  sqlite-db:
    name: sanad-sqlite-db
