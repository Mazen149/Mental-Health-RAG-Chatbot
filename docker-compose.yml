# =============================================================================
# SANAD AI — Docker Compose (Production)
# =============================================================================
# Services:
#   - backend  : FastAPI (uvicorn) on port 8000
#   - frontend : Nginx serving the SPA on port 80 → exposed as 3000
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + RAG pipeline
  # ---------------------------------------------------------------------------
  backend:
    image: mazen1393/sanad-ai-backend:latest
    container_name: sanad-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env # All secrets & model config (see .env.example)

    environment:
      - PYTHONUNBUFFERED=1 # Ensure real-time log output

    volumes:
      - backend-artifacts:/app/artifacts # Persist downloaded HF models
      - backend-qdrant:/app/qdrant_db # Persist local Qdrant data

    networks:
      - sanad-network

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 5s
      start_period: 600s # Backend downloads models on first start (~5 min)
      retries: 3

    deploy:
      resources:
        limits:
          memory: 4G # Cap memory (adjust for your host)
        reservations:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend — Nginx SPA
  # ---------------------------------------------------------------------------
  frontend:
    image: mazen1393/sanad-ai-frontend:latest
    container_name: sanad-frontend
    restart: unless-stopped

    ports:
      - "3000:80" # Access UI at http://localhost:3000

    networks:
      - sanad-network

    depends_on:
      backend:
        condition: service_healthy # Wait until backend is healthy

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80/ || exit 1" ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# =============================================================================
# Network — isolated bridge network for inter-service communication
# =============================================================================
networks:
  sanad-network:
    name: sanad-network
    driver: bridge

# =============================================================================
# Volumes — named volumes for data persistence across restarts
# =============================================================================
volumes:
  backend-artifacts:
    name: sanad-backend-artifacts
  backend-qdrant:
    name: sanad-backend-qdrant
